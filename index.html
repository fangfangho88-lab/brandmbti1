{declaration:'你习惯通过创造，让尚未清楚的答案逐渐出现。',world:'你可能更关注尚未实现的产品、服务与体验。有些问题需要在真实制作和使用中才能看清，创造本身也是理解价值的方法。',choice:'你倾向先把可能变成可体验的东西，再从实际反馈中调整判断。想法、原型、体验和重新理解之间，可能构成品牌习惯的学习循环。',strength:'这种方式可能让抽象价值不断获得真实载体。一次次尝试若能留下共同认识，就能逐渐形成品牌自己的产品语言与价值架构。',scenes:['讨论方向时，把抽象设想变成一个可以体验的简单版本。','发现意外使用方式后，尝试新的产品或服务形式。','面对不确定的创意，以有限资源获得实际认识。'],risk:'不断创造可能留下很多成果，却没有留下成果之间的关系。如果每次都重新开始，实验经验便难以积累为品牌自己的能力。',growth:'每轮尝试结束时，记录它验证了什么价值、用户为何在意，以及下一次可以复用什么。再判断应该纵向做深，还是尝试新的载体。',question:'这些不同的创造，共同证明了什么值得长期存在的价值？',loop:'提出可能 → 创造载体 → 真实体验 → 更新理解 → 再次创造'},
{declaration:'你在与人和场域的连接中，发现品牌继续生长的可能。',world:'你可能将用户、伙伴和社区看作价值创造的参与者。关系带来的不仅是传播和渠道，也可能改变品牌对需求与自身价值的理解。',choice:'面对新项目，你倾向考虑与谁共同创造，以及参与者能够带来哪些不同认识。真实互动帮助品牌逐步形成行动方向。',strength:'这种开放可能形成共同知识、参与感与持续信任。关系若能不断产生新的认识与载体，生态便成为品牌的价值发现系统。',scenes:['顾客提出需求后，邀请他们参与后续讨论与体验。','合作时寻找共同价值，而不仅是把两个标志放在一起。','进入新场域前，理解当地人群及其生活关系。'],risk:'参与者期待不同，可能让品牌消耗精力却失去自己的判断。合作数量增加，也不自动意味着品牌获得了新的能力或认识。',growth:'为一次合作明确共同创造的价值、各自的决策责任，以及结束后希望留下的用户认识、能力或关系。',question:'合作结束后，品牌会比开始前多获得什么可以延续的东西？',loop:'进入关系与场域 → 共同发现 → 共创载体 → 真实反馈 → 沉淀新能力'},
{declaration:'你让值得创造的价值，拥有持续存在的现实条件。',world:'你可能更关注价值是否被真实选择与支持。需求、支付意愿、成本与交付条件，帮助你理解一个想法能否持续。',choice:'面对资源取舍，你倾向参考真实经营反馈，把投入用于值得继续的方向。市场反馈既帮助选择，也推动产品与实现方式更新。',strength:'这种现实感可能为长期创造建立基础。经营留下的资源与用户认识，能够反过来支持研发、体验改善和新的价值尝试。',scenes:['产品获得好评但购买有限时，检查需求、价格、渠道和交付之间的关系。','多个项目需要投入时，同时考虑持续需求与资源承载。','业务表现变化时，通过真实选择重新理解产品价值。'],risk:'短期可见结果可能遮住需要时间形成的文化、研发和关系价值。经营反馈很重要，但未必能独自定义品牌值得坚持的一切。',growth:'为一个项目分别设定近期经营观察和长期价值积累目标，区分暂时未回报的投入与需要重新判断的模式。',question:'我们怎样让商业支持核心价值，而不在经营过程中逐渐消耗它？',loop:'真实需求 → 价值交换 → 经营反馈 → 调整资源与载体 → 支持下一轮创造'},
{declaration:'你希望一次有效的创造，成为品牌下一次生长的基础。',world:'你可能更关心成功如何被理解、共享与延续。品牌扩大或成员变化时，重要经验仍应有机会留在组织里。',choice:'面对协作和扩张，你倾向整理分工与方法，让团队能够持续创造和交付。反馈若能进入方法更新，稳定与变化就能共同发生。',strength:'这种方式可能积累共同知识、协作习惯与一致体验，让品牌的特征逐渐超越单个人的临时发挥。',scenes:['某个团队表现出色时，研究哪些经验可以被其他团队理解与使用。','进入新场域时，区分必须一致的体验与可以适应的部分。','关键成员变化时，尝试保留判断依据与重要方法。'],risk:'已有方法可能使组织更擅长重复，却难以回应新的价值空间。标准只有能够被反馈修正，才会支持持续生长。',growth:'选择一套常用方法，同时记录它适用的条件、失效的信号和更新责任，让实验得到的认识能够回到组织。',question:'哪些经验值得延续，哪些方法已经需要为新的机会重新组织？',loop:'有效经验 → 共同方法 → 持续交付 → 外部反馈 → 更新组织能力'}

'use strict';
const TYPES=['信念型','探索型','创造型','共生型','经营型','秩序型'];const COLORS=['#d7c9e0','#c1ddd2','#c9dce5','#ece3ae','#e39b86','#e0e0d5'];
const QUESTIONS=[
['遇到赚钱的机会，我们会先看它是否符合品牌的原则。',0],
['生意稳定时，我们也会主动了解新的用户需求。',1],
['有了新想法，我们喜欢先做一个简单版本试试看。',2],
['决定新产品做什么时，我们会邀请顾客或伙伴一起想。',3],
['几个项目都想做时，我们会先比较真实需求和投入回报。',4],
['一个做法有效后，我们会整理方法，让其他人也能用。',5],
['原来的办法不管用时，我们会换办法，但保留想坚持的价值。',0],
['发现值得尝试的新需求，我们愿意调整原来的计划。',1],
['讨论迟迟没有结论时，我们会做个小测试再决定。',2],
['顾客或伙伴的参与，会真正改变我们最后做出的东西。',3],
['产品表现不好时，我们会根据实际销售和用户反馈调整。',4],
['准备扩大业务时，我们会先安排好分工和协作方式。',5]
];
const KEY='brand-mbti-quick-2.0',VERSION='quick-2.0';let s={answers:[],index:0,brand:'',feedback:''};let canSave=true;try{let p=JSON.parse(localStorage.getItem(KEY));if(p&&Array.isArray(p.answers)&&p.answers.length<=12){s={...s,...p};s.index=Math.min(11,Math.max(0,Number(s.index)||0));}}catch{canSave=false}const app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{canSave=false}}
function valid(v){return Number.isInteger(v)&&v>=1&&v<=5||v==='unknown'}
function complete(){return QUESTIONS.every((_,i)=>valid(s.answers[i]))}
function score(answers){if(!QUESTIONS.every((_,i)=>valid(answers[i])))throw Error('答案未完成');let counts=TYPES.map((_,i)=>QUESTIONS.map((q,n)=>q[1]===i?answers[n]:null).filter(v=>Number.isInteger(v)));let means=counts.map(v=>v.length===2?(v[0]+v[1])/2:null);let enough=means.every(v=>v!==null);let ranked=means.map((v,i)=>({v,i})).filter(x=>x.v!==null).sort((a,b)=>b.v-a.v);let flat=enough&&ranked[0].v===ranked[5].v;let primary=enough&&!flat?ranked.filter(x=>x.v===ranked[0].v).map(x=>x.i):[];let others=ranked.filter(x=>!primary.includes(x.i));let companion=primary.length===1&&others.length?others.filter(x=>x.v===others[0].v).map(x=>x.i):[];return {means,primary,companion,status:!enough?'insufficient':flat?'flat':primary.length===1?'single':'joint'};}
function btn(text,fn,cl=''){let b=document.createElement('button');b.textContent=text;b.onclick=fn;b.className=cl;return b}
function top(){window.scrollTo({top:0,behavior:'instant'})}
function home(){app.innerHTML=`<div class="home"><p class="eyebrow">LIVING BRAND / BRAND MBTI</p><h1>你的品牌，<br>习惯怎样生长？</h1><p>用日常经营里的真实选择，<br>看见品牌自己的做事方式。</p><p class="muted">12道短题 / 预计约2–3分钟 / 六种人格倾向</p><label style="max-width:420px">品牌名称（选填）<input id="brand" maxlength="80" placeholder="也可以匿名作答" value="${esc(s.brand)}"></label><div class="actions" id="start"></div></div><div class="section"><p>没有标准正确答案。请根据过去一年团队实际的做法回答，别选你希望它成为的样子。</p><p class="muted">这是重新编写的快速体验题库；结果帮助自我观察，不是经过统计验证的品牌分类。</p></div>`;document.getElementById('start').append(btn(s.answers.some(valid)?'继续测试 →':'开始测试 →',()=>{s.brand=document.getElementById('brand').value.trim();save();question()},'primary'));if(complete())document.getElementById('start').append(btn('查看已有结果',result));}
function question(){let n=s.index;app.innerHTML=`<p class="eyebrow">BRAND MBTI / ${String(n+1).padStart(2,'0')} / 12</p><progress value="${s.answers.filter(valid).length}" max="12" aria-label="答题进度"></progress><div class="qwrap"><h2 tabindex="-1">${QUESTIONS[n][0]}</h2><div class="options" role="radiogroup" aria-label="符合程度"></div><p id="error" class="alert" role="alert"></p><div id="nav" class="actions"></div></div><p class="muted">选择平时真实的做法。${canSave?'已自动保存到本机。':'当前浏览器无法保存，请在本次完成。'}</p>`;let opts=['完全不像','不太像','有时候像','比较像','非常像'];for(let i=0;i<6;i++){let v=i===5?'unknown':i+1;let b=btn(i===5?'暂时无法判断':`${i+1}　${opts[i]}`,()=>{s.answers[n]=v;save();question()},'option');b.setAttribute('role','radio');b.setAttribute('aria-checked',String(s.answers[n]===v));document.querySelector('.options').append(b)}let nav=document.getElementById('nav');nav.append(btn('← '+(n?'上一题':'返回首页'),()=>{if(n){s.index--;save();question()}else home()}));nav.append(btn(n===11?'查看结果 →':'下一题 →',()=>{if(!valid(s.answers[n])){document.getElementById('error').textContent='请先选择一项。';return}if(n<11){s.index++;save();question();top();document.querySelector('h2').focus()}else if(complete()){s.submittedAt=new Date().toISOString();save();result();top()}else{let missing=QUESTIONS.findIndex((_,i)=>!valid(s.answers[i]));s.index=missing;question()}},'primary'));}
function radar(values){let cx=250,cy=230,r=145;const point=(i,d)=>[cx+Math.sin(i*Math.PI/3)*d,cy-Math.cos(i*Math.PI/3)*d];const polygon=d=>TYPES.map((_,i)=>point(i,d).join(',')).join(' ');return `<svg viewBox="0 0 500 470" role="img" aria-label="六维倾向图，完整数值见下方表格"><g fill="none" stroke="#d5d5ce">${[1,2,3,4,5].map(v=>`<polygon points="${polygon(r*v/5)}"/>`).join('')}${TYPES.map((_,i)=>`<path d="M250 230 L${point(i,r).join(' ')}"/>`).join('')}</g><polygon points="${values.map((v,i)=>point(i,r*(v??0)/5).join(',')).join(' ')}" fill="#c9dce5" fill-opacity=".65" stroke="#222" stroke-width="2"/>${TYPES.map((n,i)=>{let p=point(i,r+40);return `<text x="${p[0]}" y="${p[1]}" font-size="14" text-anchor="middle" fill="#333">${n}</text>`}).join('')}</svg>`}
function result(){const r=score(s.answers);const ids=r.primary;const names=ids.map(i=>TYPES[i]).join('、');const label=ids.length===1?'主导人格':ids.length?'并列倾向':'当前画像';const intro=ids.length?ids.map(i=>LIFE[i].world).join(' '):r.status==='flat'?'你的六种倾向得分相同，目前没有明显靠前的做事方式。可以保留这份画像，结合最近一次项目再看哪些习惯更常发生。':'部分问题缺少实际经历，暂时不指定人格。你仍可以从一次真实项目中，回顾团队如何发现需求、做出选择和留下经验。';const strip=TYPES.map((n,i)=>`<div class="type ${ids.includes(i)?'selected':''}" style="background:${COLORS[i]}">${'ABCDEF'[i]}　${n}<small>brand personality</small></div>`).join('');let strength=ids.length?ids.map(i=>`<article class="card"><p class="eyebrow">${TYPES[i]}</p><h3>你独特的生命力</h3><p>${LIFE[i].strength}</p></article>`).join(''):'<article class="card"><h3>先看团队如何行动</h3><p>选择一次新项目，记录最初关注的问题、真正影响决定的依据，以及结束后留下的经验。不同场景可能启动不同方式。</p></article>';let risks=ids.length?ids.map(i=>`<p>${LIFE[i].risk}</p>`).join(''):'<p>没有明确类型不意味着品牌缺少特点。先观察真实行为，避免为了得到标签而改变答案。</p>';let growth=ids.length?ids.map(i=>`<p>${LIFE[i].growth}</p>`).join(''):'<p>下一次项目结束时，留下一份简短记录：用户在意什么、什么做法有效、下一次准备怎样改。</p>';let question=ids.length===1?LIFE[ids[0]].question:ids.includes(2)&&ids.includes(4)?'这些实际尝试，除了带来收入和产品，还为品牌留下了什么值得继续积累的价值？':'如果下一次项目结束后，品牌只能多留下一样东西，你希望那是什么？';app.innerHTML=`<div class="types">${strip}</div><div class="hero"><p class="eyebrow">你的品牌MBTI画像${s.brand?' / '+esc(s.brand):''}</p><h1>${names||'多种方式，尚待观察'}</h1><p>${label}${r.companion.length?' · 伴随人格：'+r.companion.map(i=>TYPES[i]).join('、'):''}</p><p>${intro}</p></div><figure class="chart">${r.status==='insufficient'?'<p style="padding:30px">部分维度资料不足，暂不绘制完整雷达图。可在下方查看有效得分。</p>':radar(r.means)}<figcaption>六种做事倾向 / 反映本次自评，不是能力排名</figcaption></figure><section class="section"><p class="eyebrow">01 / PROFILE</p><h2>你的品牌，如何生长</h2><p>${ids.includes(2)&&ids.includes(4)?'创造让想法变成真实体验，经营反馈帮助选择哪些值得继续。两种倾向结合时，值得观察每次尝试能否留下持续的用户认识与经验，让创造获得下一轮生长的基础。':ids.length?ids.map(i=>LIFE[i].choice).join(' '):intro}</p></section><section class="section"><p class="eyebrow">02 / YOUR STRENGTH</p><h2>你的优势倾向</h2><div class="grid">${strength}</div></section><section class="section"><p class="eyebrow">03 / GROWTH</p><h2>值得留意的另一面</h2>${risks}<h3>让自己更好地生长</h3>${growth}<p class="muted">这些是发展提示，需结合实际情况判断，不是已确认的经营问题。</p></section><section class="section"><p class="eyebrow">04 / NEXT QUESTION</p><h2>现在最值得带走的问题</h2><blockquote>${question}</blockquote></section><details><summary>查看六维得分与简要说明</summary><table><tr><th>人格</th><th>均分 / 5</th></tr>${TYPES.map((n,i)=>`<tr><td>${n}</td><td>${r.means[i]===null?'资料不足':r.means[i].toFixed(1)}</td></tr>`).join('')}</table><p class="muted">Q2.0快速版：每种人格2题，取平均；最高为主导，最高并列则全部显示。仅单一最高时显示次高及其并列为伴随。全同分不指定类型；任一维缺少有效答案时不进行完整类型排序。没有绝对门槛、复杂权重或诊断算法。快速版题库已改变，不与1.0题库结果直接比较。示例与建议不代表品牌已发生的事实。</p></details><details id="feedback"><summary>留下一句反馈</summary><label>哪里像你们，哪里不太像？<textarea id="feedbackText" maxlength="2000">${esc(s.feedback)}</textarea></label><button id="saveFeedback">保存到本机</button><p id="status" role="status"></p></details><div class="actions" id="tools"></div>`;document.getElementById('saveFeedback').onclick=()=>{s.feedback=document.getElementById('feedbackText').value;save();document.getElementById('status').textContent=canSave?'反馈已保存到本机。':'无法保存到本机，请复制或下载记录。'};document.getElementById('tools').append(btn('打印 / 保存PDF',()=>window.print(),'primary'),btn('复制结果',async()=>{try{await navigator.clipboard.writeText(`${s.brand||'我的品牌'} · ${names||'暂不指定类型'}\n${intro}\n成长问题：${question}\n品牌MBTI Q2.0 · 探索性未验证模型`);alert('结果已复制')}catch{alert('浏览器未允许复制，可使用打印保存。')}}),btn('下载记录',()=>{let u=URL.createObjectURL(new Blob([JSON.stringify({assessment_version:VERSION,report_version:VERSION,brand:s.brand,answers:s.answers,result:r,feedback:s.feedback,submitted_at:s.submittedAt,model_status:'探索性未验证'},null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='brand-mbti-quick-2.0.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}),btn('修改答案',()=>{s.index=0;question();top()}),btn('重新测试',()=>{if(confirm('清除本次答案，重新开始？')){s={answers:[],index:0,brand:'',feedback:''};save();home();top()}}));}
home();

</script></body></html>
